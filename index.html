<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سامانه یادمان شهدا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./asset/style/style.css" />
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">خانه</a></li>
                <li><a href="#">کارهای ما</a></li>
                <li><a href="#">درباره ما</a></li>
                <li><a href="#">تماس با ما</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="logo">
                <div class="flame"></div>
                <h1>سامانه یادمان شهدا</h1>
                <p>MARTYR MEMORIAL SYSTEM</p>
            </div>

            <div class="form-box">
                <div class="tabs">
                    <button id="loginTab" class="active">ورود</button>
                    <button id="signupTab">ثبت‌نام</button>
                </div>

                <form id="loginForm" class="form active">
                    <label>نام کاربری</label>
                    <input class="shake" type="text" placeholder="نام کاربری">
                    <label>رمز عبور</label>
                    <input class="shake" type="password" placeholder="رمز عبور">
                    <button type="submit" class="gold-btn">ورود</button>
                    <a href="#" class="forgot">فراموشی رمز عبور</a>
                </form>

                <form id="signupForm" class="form">
                    <label>نام کامل</label>
                    <input class="shake" type="text" placeholder="نام و نام خانوادگی">
                    <label>ایمیل</label>
                    <input class="shake" type="email" placeholder="ایمیل">
                    <label>رمز عبور</label>
                    <input class="shake" type="password" placeholder="رمز عبور">
                    <button type="submit" class="gold-btn">ثبت‌نام</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 یادمان شهدا | طراحی با ❤️ توسط Loopfinity Team</p>
    </footer>

    <script src="./asset/js/script.js"></script>
</body>

</html>
